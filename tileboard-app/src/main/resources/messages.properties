# Root fallback bundle (identical to messages_fa.properties) - guards against a missing-bundle
# warning if the resolved locale ever does not exactly match "fa". The app locale is fixed to fa
# (see application.yml: spring.mvc.locale-resolver=fixed), so this file is a safety net, not the
# primary catalog.
# Key = the errorCode carried by LocalizableException/ApiException subclasses
# (see com.tileboard.serial.support.error.LocalizableException), or a
# request/validation key used directly by GlobalExceptionHandler / the DTOs
# under com.tileboard.app.dto.
#
# {0}, {1}, ... are positional placeholders (java.text.MessageFormat),
# filled from each exception's args(). Keep this file in sync whenever a
# new errorCode is introduced - GlobalExceptionHandler falls back to the
# exception's raw (English) message if a key is missing here, so a missing
# translation degrades gracefully rather than breaking the request.

# --- tileboard-app: ApiException subclasses ---
device.not_configured=پیکربندی دستگاه (ابعاد صفحه) هنوز تنظیم نشده است.
device.configured=پیکربندی دستگاه با موفقیت انجام شد.
gateway.not_connected=اتصال سریال فعالی به صفحه وجود ندارد. ابتدا پورت‌ها را متصل کنید.
game.no_active=در حال حاضر هیچ بازی‌ای در حال اجرا نیست.
ports.not_assigned=پیش از اتصال، دست‌کم پورت خروجی باید تخصیص داده شود.
serial.port_operation_failed=عملیات روی پورت سریال «{0}» ناموفق بود.
serial.all.available={0} پورت قابل اتصال یافت شد

