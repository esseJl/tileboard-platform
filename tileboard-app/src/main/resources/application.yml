spring:
  application:
    name: tileboard-app

server:
  port: 8080

tileboard:
  serial:
    baud-rate: 115200
    data-bits: 8
    stop-bits: 1
    read-timeout-millis: 50
    write-timeout-millis: 50
    handshake-min-sequence: 0

# Only read-only, non-sensitive endpoints are exposed by default - health
# and info are safe to leave world-readable behind a load balancer / k8s
# probe even with no auth in front of the app yet. Anything more (env,
# beans, heapdump, ...) must stay opt-in and, once Spring Security is added
# (see README "What's intentionally deferred"), should be locked down too.
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.tileboard: DEBUG
