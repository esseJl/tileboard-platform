spring:
  application:
    name: tileboard-game-engine
  datasource:
    url: jdbc:sqlite:app.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: update    # Hibernate creates/extends the schema from the entities
    properties:
      # Hibernate's second-level cache (entity/query cache). Only entities explicitly
      # annotated with @Cacheable (see ApplicationSetting) are actually cached, hence
      # ENABLE_SELECTIVE rather than ALL. This is the ONLY cache in the app - there is
      # no separate Spring/Caffeine service-level cache anymore.
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
      hibernate:
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: jcache
        javax:
          cache:
            provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider

server:
  port: 8080

tileboard:
  settings:
    store: jpa    #  dev/demo/test    ---- jpa on production
  serial:
    baud-rate: 115200
    data-bits: 8
    stop-bits: 1
    read-timeout-millis: 50
    write-timeout-millis: 50
    handshake-min-sequence: 0
  serial-monitor:
    enabled: true
    interval: 5s
    scan-cache-ttl: 1s
    loss-confirmations: 2
    not-connected-is-down: true
  engine:
    tick-interval: 100ms
    session-ttl: 30m
    frame-reassembly-timeout: 500ms
    event-bus-queue-capacity: 256
    touch-history-max-size: 2000

tileboard.serial-auto-reconnect:
  enabled: true
  interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Needed so /actuator/health shows the serialLink component (state, ports, reason).
      # This app has no authentication: on an untrusted network use "when-authorized" + Spring Security.
      show-details: always
      # /actuator/health/liveness and /readiness (exclude serialLink -> a missing board never restarts the container)
      probes:
        enabled: true

logging:
  level:
    com.tileboard: DEBUG
